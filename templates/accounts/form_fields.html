{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form.visible_fields %}
  <div>
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}
      <div id="{{ field.auto_id }}_helptext" class="form-text">{{ field.help_text|safe }}</div>
    {% endif %}
    {% if field.errors %}
      <div id="{{ field.auto_id }}_error" class="invalid-feedback d-block">{{ field.errors }}</div>
    {% endif %}
  </div>
{% endfor %}
